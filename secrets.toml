# ============================================================
# .streamlit/secrets.toml
# 使用说明：
#   1. 把本文件放在项目根目录的 .streamlit/ 文件夹下
#   2. 确保 .gitignore 里包含 .streamlit/secrets.toml（不要上传密钥！）
#   3. Streamlit Cloud 部署时，在后台 Settings → Secrets 粘贴同样内容
# ============================================================

# ── 支付提供商（stripe 或 bmac）────────────────────────────
payment_provider = "stripe"

# ── 测试模式（上线前保持 true，收真实钱时改为 false）──────
testing_mode = true

# ── Stripe 测试密钥（在 Stripe Dashboard → Developers 获取）
stripe_api_key_test = "sk_test_把你的测试密钥填在这里"
stripe_link_test    = "https://buy.stripe.com/test_把你的测试支付链接填在这里"

# ── Stripe 正式密钥（上线后启用）──────────────────────────
stripe_api_key = "sk_live_把你的正式密钥填在这里"
stripe_link    = "https://buy.stripe.com/把你的正式支付链接填在这里"

# ── Google OAuth（在 Google Cloud Console 创建凭据后填入）──
# 创建步骤：
#   1. 访问 https://console.cloud.google.com/
#   2. 创建项目 → APIs & Services → Credentials → OAuth 2.0 Client ID
#   3. 应用类型选 "Web application"
#   4. Authorized redirect URIs 添加：
#      - 本地调试：http://localhost:8501/
#      - 云端部署：https://你的应用名.streamlit.app/
[google_oauth]
client_id     = "把你的 Google Client ID 填在这里.apps.googleusercontent.com"
client_secret = "把你的 Google Client Secret 填在这里"
redirect_uri  = "https://你的应用名.streamlit.app/"
